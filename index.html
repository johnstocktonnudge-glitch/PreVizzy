<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PreVizzy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>PreVizzy</title>
</head>
<body>

<header>
  <h1>PreVizzy</h1>
  <span id="count">Clips 0/10</span>
</header>

<main>
  <!-- Video area: live camera, or playback of the timeline -->
  <section id="stage">
    <video id="live" playsinline muted autoplay></video>
    <video id="play" playsinline hidden></video>
    <video id="play2" playsinline hidden style="visibility:hidden"></video>
    <div id="rec-badge" hidden>&#9679; REC <span id="rec-time">0:00</span></div>
    <button id="backlive" hidden>Back to camera</button>
    <div id="msg"></div>
  </section>

  <div id="panel">
    <!-- Record row -->
    <section id="controls">
      <button id="flip" class="side">Flip</button>
      <button id="rec" aria-label="Record / Stop"><span></span></button>
      <button id="playall" class="side">Play all</button>
    </section>

    <!-- Timeline: clips in order, newest on the right -->
    <section id="timeline-wrap">
      <div id="timeline"></div>
      <div id="trim" hidden>
        <div class="row"><label for="trim-in">Start</label><input id="trim-in" type="range" min="0" max="1" step="0.1" value="0"></div>
        <div class="row"><label for="trim-out">End</label><input id="trim-out" type="range" min="0" max="1" step="0.1" value="1"></div>
        <div id="trim-info"></div>
      </div>
    </section>

    <section id="actions">
      <button id="save">Save video</button>
      <button id="clear" class="quiet">Clear all</button>
    </section>
  </div>
</main>

<footer>
  <span id="ver"></span>
  <button id="update" class="quiet">Check for updates</button>
  <span id="update-msg"></span>
</footer>

<!-- Shown while saving and when the saved video is ready -->
<div id="overlay" hidden>
  <div class="card">
    <h2 id="ov-title">Saving video</h2>
    <p id="ov-text">Keep this screen open.</p>
    <div id="bar"><div id="bar-fill"></div></div>
    <div class="row-btns">
      <button id="ov-save" hidden>Save to device</button>
      <button id="ov-close" class="quiet">Cancel</button>
    </div>
  </div>
</div>

<canvas id="canvas" hidden></canvas>
<script src="app.js"></script>
</body>
</html>
