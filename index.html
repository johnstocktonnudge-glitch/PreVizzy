<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PreVizzy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>PreVizzy</title>
</head>
<body>

<div id="app">

  <!-- Full screen picture: live camera, or the timeline preview -->
  <div id="stage">
    <video id="live" playsinline muted autoplay></video>
    <canvas id="view" hidden></canvas>
    <div id="stillbox" hidden></div>
    <button id="center-play" aria-label="Play" hidden></button>
    <div id="msg"></div>
    <button id="zchip" hidden>1.0&times;</button>
  </div>

  <!-- Record button: right of the picture, like a camera app -->
  <button id="rec" aria-label="Record / Stop"><span></span></button>

  <!-- Top bar -->
  <div id="top">
    <span id="ver"></span>
    <span id="count">Clips 0/10</span>
    <span id="rec-badge" hidden>&#9679; REC <span id="rec-time">0:00</span></span>
    <span class="grow"></span>
    <button id="golive" class="pill" hidden>Camera</button>
    <button id="mono" class="pill">B&amp;W</button>
    <button id="lens" class="pill" hidden>Lens</button>
    <button id="flip" class="pill">Flip</button>
    <button id="save" class="pill">Export</button>
    <button id="savepj" class="pill accent">Save project</button>
    <button id="more" class="pill" aria-label="More">&#8943;</button>
  </div>

  <div id="menu" hidden>
    <button id="update" class="pill">Check for updates</button>
    <div id="update-msg"></div>
    <div id="engine-info"></div>
    <button id="dbgbtn" class="pill">Show debug log</button>
    <button id="pj-open" class="pill">Projects</button>
    <button id="pj-saveas" class="pill">Save project as...</button>
    <button id="pj-new" class="pill">New project</button>
    <button id="clear" class="pill">Clear timeline (delete clips)</button>
  </div>

  <!-- Bottom: edit panel, transport, timeline -->
  <div id="bottom">

    <div id="edit" hidden>
      <div id="tabs">
        <button data-tab="trim" class="tab on">Trim</button>
        <button data-tab="zoom" class="tab">Zoom</button>
        <button data-tab="reframe" class="tab">Reframe</button>
        <button data-tab="join" class="tab">Join</button>
        <span id="edit-title"></span>
        <span class="grow"></span>
        <span id="tinfo"></span>
        <button id="edit-done" class="pill">Done</button>
      </div>
      <div id="pane-trim" class="pane">
        <div id="tbar"><div id="tsel"></div><div id="th-in" class="th"></div><div id="th-out" class="th"></div></div>
      </div>
      <div id="pane-zoom" class="pane" hidden>
        <input id="zoom" type="range" min="1" max="4" step="0.05" value="1">
        <span id="zoomv">1.0x</span>
        <button id="zreset" class="pill">Reset</button>
      </div>
      <div id="pane-join" class="pane" hidden>
        <span id="jhint">Join to next clip:</span>
        <button class="pill jbtn" data-join="b">Blend</button>
        <button class="pill jbtn" data-join="f2">Fade 2s</button>
        <button class="pill jbtn" data-join="f4">Fade 4s</button>
      </div>
      <div id="pane-reframe" class="pane" hidden>
        <span id="rhint">Drag the picture to move it.</span>
        <button id="rreset" class="pill">Centre</button>
      </div>
    </div>

    <div id="timerow">
      <button id="playbtn" aria-label="Play / Pause"></button>
      <span id="time">0:00 / 0:00</span>
    </div>

    <div id="tl">
      <div id="tl-clips"></div>
      <div id="playhead"></div>
    </div>
  </div>
</div>

<!-- Shown while saving and when the saved video is ready -->
<div id="overlay" hidden>
  <div class="card">
    <h2 id="ov-title">Saving video</h2>
    <p id="ov-text">Keep this screen open.</p>
    <div id="bar"><div id="bar-fill"></div></div>
    <div class="row-btns">
      <button id="ov-save" hidden>Save to device</button>
      <button id="ov-share" hidden>Share</button>
      <button id="ov-keep" hidden>Keep in project</button>
      <button id="ov-close" class="pill">Cancel</button>
    </div>
  </div>
</div>

<!-- Two hidden players: one plays while the next waits ready -->
<div id="pj" hidden><div class="card"><div id="pj-body"></div></div></div>

<pre id="dbg" hidden></pre>
<div id="pool"><video id="pA" playsinline></video><video id="pB" playsinline></video></div>
<canvas id="canvas" hidden></canvas>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="projects.js"></script>
</body>
</html>
